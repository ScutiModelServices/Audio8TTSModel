# Audio8 text-to-speech service: N API replicas behind one nginx address. Each replica runs the model in its own process
# on the GPU (the 0.6B model plus its codec, about 2.5 GB of weights; measure the memory with nvidia-smi); the downloaded
# weights are shared through the models volume, the reference voices through the voices volume.
# Needs an NVIDIA GPU and the NVIDIA Container Toolkit (Docker Desktop on Windows: WSL2 backend with GPU support).
# Start:  docker compose up -d --build          (callers use http://<host>:9200)
# Scale:  AUDIO8_REPLICAS=2 docker compose up -d --build, then: docker compose restart audio8_lb

name: audio8

services:
  audio8:
    build: .
    restart: unless-stopped
    environment:
      AUDIO8_ADMIN_PASSWORD: ${AUDIO8_ADMIN_PASSWORD:-}
      AUDIO8_NUM_THREAD: ${AUDIO8_NUM_THREAD:-}
      AUDIO8_REPLICAS: ${AUDIO8_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - voices:/voices
      - tokens:/data
    deploy:
      replicas: ${AUDIO8_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [audio8]

  audio8_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${AUDIO8_PORT:-9200}:9200"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      audio8:
        condition: service_healthy
    networks: [audio8]

volumes:
  models:
  voices:
  tokens:

networks:
  # Other stacks reach http://audio8_lb:9200 by joining this network.
  audio8:
